name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase REST
        env:
          SUPABASE_URL: https://keempbdttyrbxfngycuk.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS --retry 3 --retry-delay 10 --max-time 30 \
            -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Keep-alive ping failed (HTTP ${code})"
            exit 1
          fi
